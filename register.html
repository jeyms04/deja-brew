<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deja Brew | Create Account</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="logo">☕</div>

        <h1>Deja Brew</h1>

        <p class="subtitle">
            Create your account
        </p>

        <form id="registerForm">

            <div class="form-group">

                <label for="fullname">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn-primary"
            >
                Create Account
            </button>

            <p id="registerMessage"></p>

        </form>

        <p class="register-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

    <script
        type="module"
        src="js/auth.js">
    </script>

</body>

</html>
